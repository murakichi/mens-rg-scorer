name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 採点ロジックのユニットテスト（src/scoring/）
      - run: npm test
      # strict TS の型チェック（vitest は型を見ないので build も回す）
      - run: npm run build

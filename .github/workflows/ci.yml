name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じPRに新しいpushが来たら古い実行は中断する（待ち時間を短くする）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build = tsc -b（strict型チェック）+ vite build。テストが緑でも型が壊れていたら落とす
      - run: npm run build
      - run: npm test
